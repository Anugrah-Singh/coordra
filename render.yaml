services:
  - type: web
    name: saas-team-workspace-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DB_POOL_MAX
        value: "10"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "10000"
