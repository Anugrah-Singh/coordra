services:
  - type: web
    name: coordra-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DB_POOL_MAX
        value: "10"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "10000"
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: AI_MAX_STEPS
        value: "4"
