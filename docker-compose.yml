services:
  postgres:
    image: postgres:16
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      POSTGRES_DB: saas_workspace
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"


volumes:
  pgdata: