name: Preview Environment Database Branching

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: neon-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manage-preview-database:
    name: Manage preview database
    runs-on: ubuntu-latest

    # Repository secrets are not passed to workflows
    # triggered from fork pull requests.
    if: >
      github.event.pull_request.head.repo.full_name ==
      github.repository

    steps:
      - name: Checkout repository
        if: github.event.action != 'closed'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Create Neon database branch
        id: create-branch
        if: github.event.action != 'closed'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: pr-${{ github.event.number }}
          ssl: verify-full

      - name: Validate migration database URL
        if: github.event.action != 'closed'
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.DATABASE_URL);

          console.log('DB host:', url.hostname);
          console.log(
            'SSL mode:',
            url.searchParams.get('sslmode')
          );

          if (url.hostname.includes('-pooler')) {
            console.error(
              'Do not run migrations through the Neon pooled URL.'
            );
            process.exit(1);
          }

          if (
            url.searchParams.get('sslmode') !==
            'verify-full'
          ) {
            console.error(
              'Neon preview URL must use sslmode=verify-full.'
            );
            process.exit(1);
          }
          NODE

      - name: Run Drizzle migrations
        if: github.event.action != 'closed'
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
        run: npm run db:migrate

      - name: Run authenticated integration tests
        if: github.event.action != 'closed'
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
          JWT_SECRET: integration-test-only-jwt-secret-with-at-least-32-characters
          FRONTEND_URL: http://localhost:3000
          DB_POOL_MAX: 2
          SHUTDOWN_TIMEOUT_MS: 1000
        run: npm run test:integration

      - name: Delete Neon database branch
        if: github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: pr-${{ github.event.number }}
