name: Preview Environment Database Branching

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: neon-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manage-preview-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        if: github.event.action != 'closed'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Create Neon Database Branch
        id: create-branch
        if: github.event.action != 'closed'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: pr-${{ github.event.number }}
          ssl: verify-full

      - name: Validate Migration Database URL
        if: github.event.action != 'closed'
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
        run: |
          node -e "
            const url = new URL(process.env.DATABASE_URL);
            console.log('DB host:', url.hostname);
            console.log('SSL mode:', url.searchParams.get('sslmode'));
            if (url.hostname.includes('-pooler')) {
              console.error('Do not run migrations through Neon pooled URL.');
              process.exit(1);
            }
          "

      - name: Run Drizzle Migrations on Isolated Branch
        if: github.event.action != 'closed'
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
        run: npm run db:migrate

      - name: Delete Neon Database Branch
        if: github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: pr-${{ github.event.number }}